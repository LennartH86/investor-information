<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Investor Radar</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1117;color:#e2e8f0;line-height:1.6}
header{background:#1a1f2e;border-bottom:1px solid #2d3748;padding:2rem;text-align:center}
header h1{font-size:1.8rem;color:#63b3ed;font-weight:700}
header p{color:#718096;font-size:.9rem;margin-top:.4rem}
nav{background:#1a1f2e;border-bottom:1px solid #2d3748;padding:1rem 2rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
nav a{color:#90cdf4;text-decoration:none;font-size:.8rem;padding:.25rem .6rem;border:1px solid #2d3748;border-radius:4px;transition:background .2s}
nav a:hover{background:#2d3748}
main{max-width:960px;margin:2rem auto;padding:0 1.5rem;display:grid;gap:1.5rem}
.card{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:1.5rem}
.card h2{font-size:1.1rem;color:#63b3ed;margin-bottom:.3rem;display:flex;align-items:center;gap:.6rem}
.card .ticker{font-size:.75rem;color:#718096;font-weight:400}
.card .meta{font-size:.78rem;color:#4a5568;margin-bottom:1rem}
.card h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#4a5568;margin:1rem 0 .4rem}
.card ul{padding-left:1.2rem;font-size:.88rem;color:#cbd5e0}
.card ul li{margin-bottom:.25rem}
.card .sources{margin-top:1rem;font-size:.8rem}
.card .sources a{color:#4a5568;text-decoration:none;display:block;margin-bottom:.2rem}
.card .sources a:hover{color:#90cdf4}
.pf-box{background:#151a27;border:1px solid #2d3748;border-radius:6px;padding:.75rem 1rem;margin-top:.4rem;display:grid;grid-template-columns:1fr 1fr;gap:.3rem .8rem;font-size:.85rem}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.pf-label{color:#718096;white-space:nowrap}
.pf-value{color:#e2e8f0;font-weight:500;text-align:right}
.pf-value.gain{color:#48bb78}
.pf-value.loss{color:#fc8181}
.pf-note{grid-column:1/-1;color:#a0aec0;font-size:.82rem;line-height:1.4;padding-top:.3rem;border-top:1px solid #2d3748}
footer{text-align:center;padding:2rem;font-size:.78rem;color:#4a5568;border-top:1px solid #2d3748;margin-top:2rem}
footer a{color:#4a5568;text-decoration:underline;cursor:pointer}
footer a:hover{color:#90cdf4}
.loading{text-align:center;padding:4rem 2rem;color:#718096}
.spinner{width:32px;height:32px;border:3px solid #2d3748;border-top-color:#63b3ed;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:4rem 2rem;color:#fc8181}
.error h2{margin-bottom:.5rem}
.error p{color:#a0aec0;margin-bottom:1rem}
.error button{background:#2d3748;color:#e2e8f0;border:1px solid #4a5568;padding:.5rem 1.5rem;border-radius:4px;cursor:pointer;font-size:.9rem}
.error button:hover{background:#4a5568}
@media(max-width:600px){.pf-box{grid-template-columns:1fr}header{padding:1.5rem 1rem}nav{padding:.75rem 1rem}}
</style>
</head>
<body>
<header>
  <h1>&#128202; Investor Radar</h1>
  <p id="subtitle">Lade Daten...</p>
</header>
<nav id="nav"></nav>
<main id="main"><div class="loading"><div class="spinner"></div><p>Daten werden aus GitHub geladen...</p></div></main>
<footer id="footer"></footer>
<script>
(function() {
  var OWNER = 'LennartH86', REPO = 'investor-information';
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/results';
  var mainEl = document.getElementById('main');
  var navEl = document.getElementById('nav');
  var subtitleEl = document.getElementById('subtitle');
  var footerEl = document.getElementById('footer');

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function parseMeta(text) {
    var m = {};
    text.split('\n').forEach(function(line) {
      var i = line.indexOf(':');
      if (i > 0) m[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return m;
  }

  function parseCompany(text) {
    var d = {};
    var tm = text.match(/^# (.+)/m);
    d.title = tm ? tm[1] : 'Unbekannt';
    var tk = d.title.match(/\(([^)]+)\)/);
    d.ticker = tk ? tk[1] : '';
    d.company = d.title.replace(/\s*\([^)]+\)$/, '').trim();
    ['Portfolio-Analyse', 'Aktuelle Meldungen', 'Management',
     'Finanzielles', 'Strategie & Ausblick', 'Quellen'].forEach(function(sec) {
      var escaped = sec.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var match = text.match(new RegExp('## ' + escaped + '\\n([\\s\\S]*?)(?=\\n## |$)'));
      d[sec] = match ? match[1].trim() : '';
    });
    return d;
  }

  function mdLinks(s) {
    return s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  }

  function mdBold(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function toList(text) {
    if (!text) return '<ul><li>Keine Informationen gefunden.</li></ul>';
    var items = [];
    text.split('\n').forEach(function(line) {
      line = line.trim();
      if (line.indexOf('- ') === 0) items.push('<li>' + mdBold(mdLinks(line.slice(2))) + '</li>');
    });
    return items.length ? '<ul>' + items.join('') + '</ul>' : '<ul><li>Keine Informationen gefunden.</li></ul>';
  }

  function toSources(text) {
    if (!text) return '<div>Keine Quellen</div>';
    var out = [];
    text.split('\n').forEach(function(line) {
      line = line.trim();
      if (line.indexOf('- ') === 0) out.push('<div>' + mdLinks(line.slice(2)) + '</div>');
    });
    return out.length ? out.join('') : '<div>Keine Quellen</div>';
  }

  function toPortfolio(text) {
    if (!text) return '';
    var rows = [];
    text.split('\n').forEach(function(line) {
      line = line.trim();
      if (line.indexOf('- ') !== 0) return;
      var m = line.match(/^-\s*\*\*(.+?):?\*\*:?\s*(.+)/);
      if (m) {
        var label = m[1].replace(/:$/, ''), value = m[2];
        var cls = '';
        var lw = label.toLowerCase();
        if (lw.indexOf('g/v') >= 0 || lw.indexOf('gewinn') >= 0 || lw.indexOf('verlust') >= 0 || lw.indexOf('rendite') >= 0) {
          var v = value.trim().replace(/^\*+/, '');
          if (v.charAt(0) === '+') cls = ' class="gain"';
          else if (v.charAt(0) === '-' || v.charCodeAt(0) === 8722) cls = ' class="loss"';
        }
        rows.push('<div class="pf-row"><span class="pf-label">' + esc(label) + '</span><span class="pf-value"' + cls + '>' + mdBold(esc(value)) + '</span></div>');
      } else {
        rows.push('<div class="pf-row pf-note">' + mdBold(esc(line.slice(2))) + '</div>');
      }
    });
    return rows.length ? '<div class="pf-box">' + rows.join('') + '</div>' : '';
  }

  function renderCard(c, meta) {
    var pf = toPortfolio(c['Portfolio-Analyse']);
    var pfSec = pf ? '<h3>Portfolio-Analyse</h3>' + pf : '';
    return '<div class="card" id="' + c.slug + '">' +
      '<h2>' + esc(c.company) + ' <span class="ticker">' + esc(c.ticker) + '</span></h2>' +
      '<div class="meta">KW' + esc(meta.KW || '??') + ' / ' + esc(meta.JAHR || '????') +
      ' &nbsp;&middot;&nbsp; ' + esc(meta.ZEITRAUM_VON || '') + ' &ndash; ' + esc(meta.ZEITRAUM_BIS || '') + '</div>' +
      pfSec +
      '<h3>Aktuelle Meldungen</h3>' + toList(c['Aktuelle Meldungen']) +
      '<h3>Management</h3>' + toList(c['Management']) +
      '<h3>Finanzielles</h3>' + toList(c['Finanzielles']) +
      '<h3>Strategie &amp; Ausblick</h3>' + toList(c['Strategie & Ausblick']) +
      '<h3>Quellen</h3><div class="sources">' + toSources(c['Quellen']) + '</div>' +
      '</div>';
  }

  function render(meta, companies) {
    var pfLine = '';
    if (meta.PORTFOLIO_WERT) pfLine += ' &nbsp;&middot;&nbsp; Portfolio: ' + esc(meta.PORTFOLIO_WERT) + ' EUR';
    if (meta.POSITIONEN) pfLine += ' &nbsp;&middot;&nbsp; ' + esc(meta.POSITIONEN) + ' Positionen';

    subtitleEl.innerHTML = 'KW' + esc(meta.KW || '??') + ' / ' + esc(meta.JAHR || '????') +
      ' &nbsp;&middot;&nbsp; ' + esc(meta.ZEITRAUM_VON || '') + ' &ndash; ' + esc(meta.ZEITRAUM_BIS || '') +
      ' &nbsp;&middot;&nbsp; ' + companies.length + ' Unternehmen' + pfLine;

    navEl.innerHTML = companies.map(function(c) {
      return '<a href="#' + c.slug + '">' + esc(c.company) + '</a>';
    }).join('');

    mainEl.innerHTML = companies.map(function(c) { return renderCard(c, meta); }).join('');

    var now = new Date();
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    var ts = pad(now.getDate()) + '.' + pad(now.getMonth() + 1) + '.' + now.getFullYear() +
      ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    footerEl.innerHTML = 'Daten live aus GitHub &nbsp;&middot;&nbsp; Geladen: ' + ts +
      ' &nbsp;&middot;&nbsp; <a onclick="load()">Aktualisieren</a>';
  }

  function showError(msg) {
    mainEl.innerHTML = '<div class="error"><h2>Fehler beim Laden</h2><p>' + esc(msg) + '</p>' +
      '<button onclick="load()">Erneut versuchen</button></div>';
    subtitleEl.textContent = 'Fehler beim Laden';
    footerEl.innerHTML = '';
  }

  window.load = function() {
    mainEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>Daten werden aus GitHub geladen...</p></div>';
    subtitleEl.textContent = 'Lade Daten...';
    navEl.innerHTML = '';

    fetch(API)
      .then(function(res) {
        if (!res.ok) throw new Error(res.status === 403
          ? 'GitHub API Rate Limit erreicht. Bitte in einigen Minuten erneut versuchen.'
          : 'GitHub API Fehler: ' + res.status);
        return res.json();
      })
      .then(function(files) {
        var metaFile = files.find(function(f) { return f.name === '_meta.md'; });
        if (!metaFile) throw new Error('Keine Metadaten gefunden. Wurde der Investor Radar diese Woche bereits ausgefuehrt?');

        var companyFiles = files
          .filter(function(f) { return /^\d{2}_.*\.md$/.test(f.name); })
          .sort(function(a, b) { return a.name.localeCompare(b.name); });

        if (!companyFiles.length) throw new Error('Keine Unternehmensdaten gefunden.');

        var fetches = [fetch(metaFile.download_url).then(function(r) { return r.text(); })];
        companyFiles.forEach(function(f) {
          fetches.push(fetch(f.download_url).then(function(r) { return r.text(); }));
        });

        return Promise.all(fetches).then(function(texts) {
          var meta = parseMeta(texts[0]);
          var companies = companyFiles.map(function(f, i) {
            var d = parseCompany(texts[i + 1]);
            d.slug = f.name.replace('.md', '');
            return d;
          });
          render(meta, companies);
        });
      })
      .catch(function(e) { showError(e.message); });
  };

  load();
})();
</script>
</body>
</html>
