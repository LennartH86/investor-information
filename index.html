<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg:        #090d14;
    --bg2:       #0f1520;
    --bg3:       #161d2e;
    --border:    #1e2a40;
    --border2:   #253047;
    --accent:    #e8a030;
    --accent2:   #c47820;
    --text:      #d8d4cc;
    --text2:     #8a94a8;
    --text3:     #4a5468;
    --green:     #4ade80;
    --red:       #f87171;
    --sidebar-w: 280px;
    --header-h:  56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    line-height: 1.6;
    overflow: hidden;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: .35;
  }

  /* ── LAYOUT ── */
  #shell {
    display: grid;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
  }

  /* ── HEADER ── */
  #header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 200;
  }

  #header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 60%);
  }

  /* Hamburger – hidden on desktop */
  #menu-btn {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 36px;
    height: 36px;
    padding: 6px;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 4px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  #menu-btn:hover { background: var(--bg3); }
  #menu-btn span {
    display: block;
    height: 1.5px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.25s, opacity 0.25s;
  }
  #menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  #menu-btn.open span:nth-child(2) { opacity: 0; }
  #menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: #fff;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }

  .header-sep {
    width: 1px;
    height: 24px;
    background: var(--border2);
    flex-shrink: 0;
  }

  #meta-bar {
    display: flex;
    gap: 16px;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .meta-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .meta-chip .label {
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 9px;
  }
  .meta-chip .val { color: var(--accent); font-weight: 500; }

  /* hide Zeitraum + Unternehmen on medium screens */
  .meta-hide-sm { }

  .header-right {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  /* ── DRAWER OVERLAY (mobile) ── */
  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
    opacity: 0;
    transition: opacity 0.25s;
    backdrop-filter: blur(2px);
    pointer-events: none;
  }
  #overlay.visible { opacity: 1; pointer-events: auto; }

  /* ── SIDEBAR ── */
  #sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
  }
  #sidebar::-webkit-scrollbar { width: 3px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .sidebar-section { padding: 14px 0 6px; }
  .sidebar-label {
    padding: 0 16px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text3);
  }

  .company-item {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s, border-left-color 0.15s;
    border-left: 2px solid transparent;
    gap: 10px;
    min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  .company-item:hover  { background: var(--bg3); border-left-color: var(--border2); }
  .company-item.active { background: var(--bg3); border-left-color: var(--accent); }
  .company-item.active .c-name   { color: #fff; }
  .company-item.active .c-ticker { color: var(--accent); }

  .c-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    width: 18px;
    flex-shrink: 0;
    text-align: right;
  }
  .c-info { flex: 1; min-width: 0; }
  .c-name {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .c-ticker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    margin-top: 1px;
  }
  .c-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text3);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .c-status.loaded  { background: var(--green); }
  .c-status.error   { background: var(--red); }
  .c-status.loading { background: var(--accent); animation: pulse 1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* ── MAIN CONTENT ── */
  #main {
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
  }
  #main::-webkit-scrollbar { width: 4px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #content-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 48px 80px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── BACK BUTTON (mobile only) ── */
  #back-btn {
    display: none;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    cursor: pointer;
    margin-bottom: 24px;
    padding: 8px 0;
    -webkit-tap-highlight-color: transparent;
    border: none;
    background: none;
    letter-spacing: 0.05em;
  }
  #back-btn:hover { color: var(--accent); }
  #back-btn::before { content: '←'; font-size: 14px; }

  /* ── WELCOME SCREEN ── */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: calc(100vh - var(--header-h));
    text-align: center;
    gap: 16px;
    padding: 40px 24px;
    animation: fadeIn 0.5s ease;
  }
  .welcome-icon  { font-size: 48px; margin-bottom: 8px; opacity: 0.6; }
  .welcome-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 28px; color: #fff; letter-spacing: -0.02em; }
  .welcome-sub   { font-size: 15px; color: var(--text2); max-width: 360px; line-height: 1.7; font-style: italic; }
  .welcome-hint  {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    margin-top: 12px;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 4px;
  }

  /* ── SKELETON ── */
  .skeleton {
    background: linear-gradient(90deg, var(--bg3) 25%, var(--border) 50%, var(--bg3) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 3px;
    display: block;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skel-h1  { height: 36px; width: 60%; margin-bottom: 24px; }
  .skel-sub { height: 14px; width: 35%; margin-bottom: 32px; }
  .skel-p   { height: 13px; width: 100%; margin-bottom: 8px; }
  .skel-p.short { width: 70%; }
  .skel-p.med   { width: 85%; }

  /* ── MARKDOWN STYLES ── */
  .md-body h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .md-body h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 32px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .md-body h2::before {
    content: '// ';
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    color: var(--text3);
    font-size: 11px;
  }
  .md-body h3 {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    margin: 20px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .md-body p        { margin-bottom: 14px; color: var(--text); line-height: 1.75; font-weight: 300; }
  .md-body em       { color: var(--text2); font-size: 12px; font-style: italic; display: block; margin-bottom: 24px; font-family: 'JetBrains Mono', monospace; }
  .md-body ul, .md-body ol { padding-left: 0; margin-bottom: 14px; list-style: none; }
  .md-body li       { padding: 4px 0 4px 20px; position: relative; color: var(--text); font-weight: 300; line-height: 1.65; }
  .md-body ul li::before { content: '—'; position: absolute; left: 0; color: var(--text3); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .md-body ol       { counter-reset: ol; }
  .md-body ol li    { counter-increment: ol; }
  .md-body ol li::before { content: counter(ol, decimal-leading-zero); position: absolute; left: 0; color: var(--accent2); font-family: 'JetBrains Mono', monospace; font-size: 10px; top: 5px; }
  .md-body a        { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent2); transition: color 0.15s, border-color 0.15s; font-family: 'JetBrains Mono', monospace; font-size: 12px; word-break: break-all; }
  .md-body a:hover  { color: #fff; border-color: #fff; }
  .md-body strong   { color: #fff; font-weight: 600; }
  .md-body blockquote { border-left: 2px solid var(--accent); margin: 20px 0; padding: 12px 20px; background: var(--bg2); border-radius: 0 4px 4px 0; color: var(--text2); font-style: italic; }
  .md-body code     { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--bg3); border: 1px solid var(--border); padding: 1px 6px; border-radius: 3px; color: var(--accent); }
  .md-body pre      { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 16px; overflow-x: auto; margin: 16px 0; }
  .md-body pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 12px; }
  .md-body hr       { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  /* ── ERROR STATE ── */
  .error-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; text-align: center; gap: 12px; }
  .error-icon { font-size: 32px; opacity: 0.5; }
  .error-msg  { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--red); }
  .error-sub  { font-size: 13px; color: var(--text2); font-style: italic; }

  /* ── SCROLLBAR GLOBAL ── */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* ════════════════════════════════
     RESPONSIVE BREAKPOINTS
  ════════════════════════════════ */

  /* ── Medium: hide some meta chips ── */
  @media (max-width: 900px) {
    .meta-hide-sm { display: none !important; }
    .header-right { display: none; }
    #meta-bar { gap: 12px; }
  }

  /* ── Mobile: full drawer layout ── */
  @media (max-width: 640px) {
    /* Shell becomes single column */
    #shell {
      grid-template-columns: 1fr;
      grid-template-rows: var(--header-h) 1fr;
    }

    /* Show hamburger, hide desktop sep */
    #menu-btn   { display: flex; }
    .header-sep { display: none; }
    #meta-bar   { display: none; }

    /* Logo slightly smaller */
    .logo { font-size: 16px; }

    /* Header date moves to right */
    .header-right {
      display: block;
      font-size: 9px;
      margin-left: auto;
    }

    /* Sidebar becomes fixed drawer */
    #sidebar {
      position: fixed;
      top: var(--header-h);
      left: 0;
      bottom: 0;
      width: min(var(--sidebar-w), 85vw);
      transform: translateX(-105%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 160;
      border-right: 1px solid var(--border2);
      box-shadow: 4px 0 32px rgba(0,0,0,0.5);
    }
    #sidebar.open { transform: translateX(0); }

    /* Overlay becomes visible */
    #overlay { display: block; }

    /* Main takes full width */
    #main { grid-column: 1; }

    /* Content padding reduced */
    #content-wrap { padding: 24px 20px 60px; }

    /* Show back button */
    #back-btn { display: flex; }

    /* Larger touch targets in list */
    .company-item { min-height: 52px; padding: 10px 16px; }
    .c-name       { font-size: 13px; }
    .c-ticker     { font-size: 10px; }

    /* Welcome screen adjustments */
    .welcome-title { font-size: 22px; }
    .welcome-sub   { font-size: 14px; }
    .welcome-hint  { font-size: 11px; }

    /* Markdown tweaks for narrow screens */
    .md-body h1 { font-size: 22px; }
    .md-body h2 { font-size: 12px; }
    .md-body p  { font-size: 14px; }
    .md-body li { font-size: 14px; }
    .md-body a  { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="overlay" id="overlay"></div>

<div id="shell">

  <!-- HEADER -->
  <header id="header">
    <div id="menu-btn" onclick="toggleDrawer()" aria-label="Menü öffnen">
      <span></span><span></span><span></span>
    </div>
    <div class="logo">INVESTOR<span>RADAR</span></div>
    <div class="header-sep"></div>
    <div id="meta-bar">
      <div class="meta-chip">
        <span class="label">KW</span>
        <span class="val" id="meta-kw">—</span>
      </div>
      <div class="meta-chip">
        <span class="label">Jahr</span>
        <span class="val" id="meta-jahr">—</span>
      </div>
      <div class="meta-chip meta-hide-sm">
        <span class="label">Zeitraum</span>
        <span class="val" id="meta-zeitraum">—</span>
      </div>
      <div class="meta-chip meta-hide-sm">
        <span class="label">Unternehmen</span>
        <span class="val">25</span>
      </div>
    </div>
    <div class="header-right" id="header-date"></div>
  </header>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Unternehmen</div>
      <div id="company-list"></div>
    </div>
  </nav>

  <!-- MAIN -->
  <main id="main">
    <div id="welcome">
      <div class="welcome-icon">◈</div>
      <div class="welcome-title">Investor Radar</div>
      <div class="welcome-sub">Wöchentliche Recherche zu 25 Unternehmen aus dem Portfolio.</div>
      <div class="welcome-hint" id="welcome-hint">← Unternehmen auswählen</div>
    </div>
  </main>

</div>

<script>
const COMPANIES = [
  { num: '01', name: 'Adidas',               ticker: 'ADS.DE',  file: '01_adidas.md' },
  { num: '02', name: 'Allianz',              ticker: 'ALV.DE',  file: '02_allianz.md' },
  { num: '03', name: 'BASF',                 ticker: 'BAS.DE',  file: '03_basf.md' },
  { num: '04', name: 'BioNTech',             ticker: 'BNTX',    file: '04_biontech.md' },
  { num: '05', name: 'Daikin',               ticker: '6367.T',  file: '05_daikin.md' },
  { num: '06', name: 'Deutsche Post / DHL',  ticker: 'DHL.DE',  file: '06_deutsche_post.md' },
  { num: '07', name: 'Energiekontor',        ticker: 'EKT.DE',  file: '07_energiekontor.md' },
  { num: '08', name: 'Equinor',              ticker: 'EQNR',    file: '08_equinor.md' },
  { num: '09', name: 'Fraport',              ticker: 'FRA.DE',  file: '09_fraport.md' },
  { num: '10', name: 'Heidelberg Materials', ticker: 'HEIG.DE', file: '10_heidelberg_materials.md' },
  { num: '11', name: 'Hochtief',             ticker: 'HOT.DE',  file: '11_hochtief.md' },
  { num: '12', name: 'Iberdrola',            ticker: 'IBE.MC',  file: '12_iberdrola.md' },
  { num: '13', name: 'Ionos',                ticker: 'IOS.DE',  file: '13_ionos.md' },
  { num: '14', name: 'Italmobiliare',        ticker: 'ITM.MI',  file: '14_italmobiliare.md' },
  { num: '15', name: 'Jumbo',                ticker: 'JUMB.AT', file: '15_jumbo.md' },
  { num: '16', name: 'LVMH',                 ticker: 'MC.PA',   file: '16_lvmh.md' },
  { num: '17', name: 'Merck',                ticker: 'MRK.DE',  file: '17_merck.md' },
  { num: '18', name: 'Munich Re',            ticker: 'MUV2.DE', file: '18_munich_re.md' },
  { num: '19', name: 'Mutares',              ticker: 'MUX.DE',  file: '19_mutares.md' },
  { num: '20', name: 'Novo Nordisk',         ticker: 'NVO',     file: '20_novo_nordisk.md' },
  { num: '21', name: 'Rio Tinto',            ticker: 'RIO',     file: '21_rio_tinto.md' },
  { num: '22', name: 'Shell',                ticker: 'SHEL',    file: '22_shell.md' },
  { num: '23', name: 'Sixt',                 ticker: 'SIX2.DE', file: '23_sixt.md' },
  { num: '24', name: 'Sto',                  ticker: 'STO3.DE', file: '24_sto.md' },
  { num: '25', name: 'Vonovia',              ticker: 'VNA.DE',  file: '25_vonovia.md' },
];

const cache     = {};
let activeFile  = null;
let drawerOpen  = false;

const sidebar   = document.getElementById('sidebar');
const overlay   = document.getElementById('overlay');
const menuBtn   = document.getElementById('menu-btn');
const mainEl    = document.getElementById('main');

/* ── DRAWER ── */
function toggleDrawer() {
  drawerOpen ? closeDrawer() : openDrawer();
}
function openDrawer() {
  drawerOpen = true;
  sidebar.classList.add('open');
  overlay.classList.add('visible');
  menuBtn.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  drawerOpen = false;
  sidebar.classList.remove('open');
  overlay.classList.remove('visible');
  menuBtn.classList.remove('open');
  document.body.style.overflow = '';
}
overlay.addEventListener('click', closeDrawer);

/* ── WELCOME HINT: mobile vs desktop ── */
function updateHint() {
  const hint = document.getElementById('welcome-hint');
  if (hint) {
    hint.textContent = window.innerWidth <= 640
      ? '☰  Menü öffnen'
      : '←  Unternehmen auswählen';
  }
}
updateHint();
window.addEventListener('resize', updateHint);

/* ── SIDEBAR LIST ── */
const list = document.getElementById('company-list');
COMPANIES.forEach(c => {
  const el = document.createElement('div');
  el.className = 'company-item';
  el.dataset.file = c.file;
  el.innerHTML = `
    <span class="c-num">${c.num}</span>
    <span class="c-info">
      <span class="c-name">${c.name}</span>
      <span class="c-ticker">${c.ticker}</span>
    </span>
    <span class="c-status" id="status-${c.file}"></span>
  `;
  el.addEventListener('click', () => {
    loadCompany(c);
    closeDrawer();          // auto-close on mobile after selection
  });
  list.appendChild(el);
});

/* ── META ── */
async function loadMeta() {
  try {
    const r = await fetch('results/_meta.md');
    if (!r.ok) return;
    const text = await r.text();
    const get = (key) => {
      const m = text.match(new RegExp(`^${key}:\\s*(.+)`, 'm'));
      return m ? m[1].trim() : '—';
    };
    document.getElementById('meta-kw').textContent       = get('KW');
    document.getElementById('meta-jahr').textContent     = get('JAHR');
    const von = get('ZEITRAUM_VON'), bis = get('ZEITRAUM_BIS');
    document.getElementById('meta-zeitraum').textContent = `${von} – ${bis}`;
  } catch(e) {}
}

/* ── HEADER DATE ── */
function setDate() {
  const now  = new Date();
  const opts = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('de-DE', opts).toUpperCase();
}

/* ── LOAD & RENDER ── */
async function loadCompany(c) {
  if (activeFile === c.file) return;

  document.querySelectorAll('.company-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`[data-file="${c.file}"]`);
  if (activeEl) activeEl.classList.add('active');
  activeFile = c.file;

  const statusEl = document.getElementById(`status-${c.file}`);

  mainEl.innerHTML = `
    <div id="content-wrap">
      <button id="back-btn" onclick="showWelcome()">Zurück zur Übersicht</button>
      <span class="skeleton skel-h1"></span>
      <span class="skeleton skel-sub"></span>
      <span class="skeleton skel-p"></span>
      <span class="skeleton skel-p med"></span>
      <span class="skeleton skel-p short"></span>
      <br>
      <span class="skeleton skel-p"></span>
      <span class="skeleton skel-p med"></span>
      <span class="skeleton skel-p"></span>
      <span class="skeleton skel-p short"></span>
    </div>
  `;

  if (statusEl) statusEl.className = 'c-status loading';

  if (cache[c.file]) { renderContent(c, cache[c.file], statusEl); return; }

  try {
    const r = await fetch(`results/${c.file}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const text = await r.text();
    cache[c.file] = text;
    renderContent(c, text, statusEl);
  } catch(err) {
    if (statusEl) statusEl.className = 'c-status error';
    mainEl.innerHTML = `
      <div id="content-wrap">
        <button id="back-btn" onclick="showWelcome()">Zurück zur Übersicht</button>
        <div class="error-state">
          <div class="error-icon">⚠</div>
          <div class="error-msg">results/${c.file} nicht gefunden</div>
          <div class="error-sub">Datei wurde noch nicht durch den Radar-Run erstellt.</div>
        </div>
      </div>
    `;
  }
}

function renderContent(c, text, statusEl) {
  if (statusEl) statusEl.className = 'c-status loaded';
  const html = marked.parse(text);
  mainEl.innerHTML = `
    <div id="content-wrap">
      <button id="back-btn" onclick="showWelcome()">Zurück zur Übersicht</button>
      <div class="md-body">${html}</div>
    </div>
  `;
  mainEl.scrollTop = 0;
}

function showWelcome() {
  activeFile = null;
  document.querySelectorAll('.company-item').forEach(el => el.classList.remove('active'));
  mainEl.innerHTML = `
    <div id="welcome">
      <div class="welcome-icon">◈</div>
      <div class="welcome-title">Investor Radar</div>
      <div class="welcome-sub">Wöchentliche Recherche zu 25 Unternehmen aus dem Portfolio.</div>
      <div class="welcome-hint" id="welcome-hint"></div>
    </div>
  `;
  updateHint();
  openDrawer();
}

// Init
loadMeta();
setDate();
</script>
</body>
</html>
